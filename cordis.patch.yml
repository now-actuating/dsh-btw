# dsh-btw is a dual-face plugin. The Host half owns the authenticated one-shot
# RPC; package.json's dsh.client metadata contributes the transient Web UI.
- insert:
    - id: btw
      name: 'dsh-btw'
      config:
        timeoutMs: 120000
        sidechain:
          mode: none
          retentionDays: 7
          maxSessions: 500
